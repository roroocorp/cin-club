<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Cinéma - Séries</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #141414;
      color: white;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #111;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #e50914;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      color: #e50914;
    }

    main {
      min-height: 75vh;
    }

    .section {
      padding: 40px;
    }

    .section h2 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .films-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    .film {
      display: block;
      background: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .film:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .thumbnail {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #e50914;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .info p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .watch {
      display: inline-block;
      background: #e50914;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #111;
      color: #777;
      margin-top: 40px;
    }

    @media (max-width: 900px) {
      .films-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 20px;
        flex-direction: column;
        gap: 15px;
      }

      nav {
        gap: 15px;
      }

      .section {
        padding: 25px 20px;
      }

      .films-row {
        grid-template-columns: 1fr;
      }

      .thumbnail {
        height: 240px;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       HEADER
  ================================================== -->
  <header>
    <div class="logo">🎬 MON CINÉMA</div>

    <nav>
      <a href="index.html">Accueil</a>
      <a href="index.html#films">Films</a>
      <a href="series.html">Séries</a>
    </nav>
  </header>


  <!-- ==================================================
       SÉRIES
  ================================================== -->
  <main>
    <section class="section">
      <h2>📺 Séries</h2>

      <div class="films-row">

        <!-- Série 1 -->
        <a class="film" href="#">
          <div class="thumbnail">
            <div class="placeholder">📺</div>
            <div class="badge">SÉRIE</div>
          </div>

          <div class="info">
            <h3>Ma série 1</h3>
            <p>Une nouvelle série arrivera bientôt.</p>
            <span class="watch">Bientôt</span>
          </div>
        </a>


        <!-- Série 2 -->
        <a class="film" href="#">
          <div class="thumbnail">
            <div class="placeholder">📺</div>
            <div class="badge">SÉRIE</div>
          </div>

          <div class="info">
            <h3>Ma série 2</h3>
            <p>De nouveaux épisodes prochainement.</p>
            <span class="watch">Bientôt</span>
          </div>
        </a>

      </div>
    </section>
  </main>


  <!-- ==================================================
       FOOTER
  ================================================== -->
  <footer>
    © 2026 Mon Cinéma
  </footer>

</body>
    </html>
