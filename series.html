<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Cinéma - Séries</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   MENU
========================= */

header{
  height:70px;
  background:#0d0d0d;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 6%;

  border-bottom:1px solid #222;

  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  color:#e50914;
  font-size:25px;
  font-weight:bold;
  letter-spacing:2px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:25px;
  font-size:15px;
  transition:.3s;
}

nav a:hover{
  color:#e50914;
}

/* =========================
   PAGE SÉRIES
========================= */

.series-header{
  padding:60px 7% 20px;
}

.series-header small{
  color:#aaa;
  font-size:13px;
  letter-spacing:3px;
}

.series-header h1{
  font-size:45px;
  margin-top:15px;
}

/* =========================
   SECTIONS
========================= */

.section{
  padding:30px 7% 5px;
}

.section h2{
  font-size:24px;
  margin-bottom:18px;
}

/* =========================
   RANGÉE
========================= */

.films-row{
  display:flex;
  gap:18px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:5px 5px 20px;

  scroll-behavior:smooth;
}

.films-row::-webkit-scrollbar{
  height:7px;
}

.films-row::-webkit-scrollbar-track{
  background:#151515;
}

.films-row::-webkit-scrollbar-thumb{
  background:#444;
  border-radius:10px;
}

/* =========================
   CARTE
========================= */

.film{
  position:relative;

  flex:0 0 260px;
  height:345px;

  background:#151515;

  border-radius:9px;
  overflow:hidden;

  transition:.3s;

  cursor:pointer;

  text-decoration:none;
  color:white;

  display:flex;
  flex-direction:column;
}

.film:hover{
  transform:scale(1.04);

  z-index:5;

  box-shadow:
    0 0 12px rgba(255,0,0,.3),
    0 10px 30px rgba(0,0,0,.7);
}

/* =========================
   LED ROUGE
========================= */

.film::before{
  content:"";

  position:absolute;

  left:0;
  top:12px;
  bottom:12px;

  width:4px;

  background:#ff0000;

  box-shadow:
    0 0 5px #ff0000,
    0 0 10px #ff0000,
    0 0 20px rgba(255,0,0,.8);

  z-index:20;
}

/* =========================
   MINIATURE
========================= */

.thumbnail{
  position:relative;

  width:100%;
  height:146px;

  flex-shrink:0;

  overflow:hidden;

  background:#222;
}

.placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #292929,
      #111111
    );

  color:#777;
  font-size:45px;
}

/* =========================
   BADGE
========================= */

.badge{
  position:absolute;

  top:10px;
  right:10px;

  z-index:15;

  padding:5px 8px;

  background:rgba(0,0,0,.8);

  border:1px solid #444;

  border-radius:4px;

  font-size:11px;
  font-weight:bold;
}

/* =========================
   INFORMATIONS
========================= */

.info{
  padding:15px;

  flex:1;

  display:flex;
  flex-direction:column;
}

.info h3{
  margin-bottom:7px;

  font-size:17px;
  line-height:1.3;

  height:44px;
  overflow:hidden;
}

.info p{
  color:#999;

  line-height:1.4;
  font-size:13px;

  height:38px;
  overflow:hidden;
}

/* =========================
   BOUTON
========================= */

.watch{
  display:inline-block;

  margin-top:auto;

  padding:8px 13px;

  background:#e50914;

  color:white;

  border-radius:5px;

  font-size:13px;
  font-weight:bold;

  width:max-content;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  color:#777;

  padding:40px;

  border-top:1px solid #222;

  margin-top:40px;
}

/* =========================
   TABLETTE
========================= */

@media(max-width:750px){

  .series-header h1{
    font-size:40px;
  }

  .film{
    flex-basis:230px;
  }

}

/* =========================
   TÉLÉPHONE
========================= */

@media(max-width:600px){

  header{
    padding:0 20px;
  }

  .logo{
    font-size:18px;
  }

  nav a{
    margin-left:10px;
    font-size:13px;
  }

  .series-header{
    padding:40px 25px 15px;
  }

  .series-header h1{
    font-size:35px;
  }

  .section{
    padding:30px 20px 5px;
  }

  .section h2{
    font-size:21px;
  }

  .film{
    flex-basis:230px;
  }

}

</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<header>

  <div class="logo">
    🎬 MON CINÉMA
  </div>

  <nav>

    <a href="index.html">
      Accueil
    </a>

    <a href="index.html#films">
      Films
    </a>

    <a href="series.html">
      Séries
    </a>

  </nav>

</header>


<!-- =========================
     SÉRIES
========================= -->

<section class="series-header">

  <small>
    MON CINÉMA
  </small>

  <h1>
    📺 Mes séries.
  </h1>

</section>


<main>

<section class="section">

<h2>📺 Séries</h2>

<div class="films-row">


<!-- SÉRIE 1 -->

<a class="film" href="#">

  <div class="thumbnail">

    <div class="placeholder">
      📺
    </div>

    <div class="badge">
      SÉRIE
    </div>

  </div>

  <div class="info">

    <h3>
      Ma série 1
    </h3>

    <p>
      Une nouvelle série
      arrivera bientôt.
    </p>

    <span class="watch">
      Bientôt
    </span>

  </div>

</a>


<!-- SÉRIE 2 -->

<a class="film" href="#">

  <div class="thumbnail">

    <div class="placeholder">
      📺
    </div>

    <div class="badge">
      SÉRIE
    </div>

  </div>

  <div class="info">

    <h3>
      Ma série 2
    </h3>

    <p>
      De nouveaux épisodes
      prochainement.
    </p>

    <span class="watch">
      Bientôt
    </span>

  </div>

</a>


</div>
</section>

</main>


<footer>
© 2026 Mon Cinéma
</footer>

</body>
</html>
