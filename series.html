<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Séries - Mon Cinéma</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   MENU
========================= */

header{
  height:70px;
  background:#0d0d0d;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 6%;

  border-bottom:1px solid #222;

  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  color:#e50914;
  font-size:25px;
  font-weight:bold;
  letter-spacing:2px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:25px;
  font-size:15px;
  transition:.3s;
}

nav a:hover{
  color:#e50914;
}


/* =========================
   PAGE
========================= */

main{
  padding:40px 7% 60px;
}


/* =========================
   TITRE
========================= */

.section-title{
  font-size:28px;
  margin-bottom:25px;
}


/* =========================
   RANGÉE
========================= */

.series-row{
  display:flex;
  gap:18px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:5px 5px 20px;
}

.series-row::-webkit-scrollbar{
  height:7px;
}

.series-row::-webkit-scrollbar-track{
  background:#151515;
}

.series-row::-webkit-scrollbar-thumb{
  background:#444;
  border-radius:10px;
}


/* =========================
   CARTE SÉRIE
========================= */

.series-card{
  position:relative;

  flex:0 0 260px;
  height:345px;

  background:#151515;

  border-radius:9px;
  overflow:hidden;

  transition:.3s;

  cursor:pointer;

  text-decoration:none;
  color:white;

  display:flex;
  flex-direction:column;
}

.series-card:hover{
  transform:scale(1.04);

  z-index:5;

  box-shadow:
    0 0 12px rgba(255,0,0,.3),
    0 10px 30px rgba(0,0,0,.7);
}


/* =========================
   LED ROUGE
========================= */

.series-card::before{
  content:"";

  position:absolute;

  left:0;
  top:12px;
  bottom:12px;

  width:4px;

  background:#ff0000;

  box-shadow:
    0 0 5px #ff0000,
    0 0 10px #ff0000,
    0 0 20px rgba(255,0,0,.8);

  z-index:20;
}


/* =========================
   MINIATURE
========================= */

.thumbnail{
  position:relative;

  width:100%;
  height:180px;

  flex-shrink:0;

  overflow:hidden;

  background:#222;
}

.thumbnail img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}


/* =========================
   PLAY
========================= */

.play{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:55px;
  height:55px;

  border-radius:50%;

  background:#e50914;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;

  box-shadow:
    0 0 12px rgba(229,9,20,.6);
}


/* =========================
   INFORMATIONS
========================= */

.info{
  padding:15px;

  flex:1;

  display:flex;
  flex-direction:column;
}

.info h3{
  margin-bottom:7px;

  font-size:17px;
  line-height:1.3;
}

.info p{
  color:#999;

  line-height:1.4;
  font-size:13px;

  margin-bottom:10px;
}


/* =========================
   REPRENDRE
========================= */

.resume{
  color:#e50914;

  font-size:13px;

  font-weight:bold;

  margin-top:auto;
}


/* =========================
   BOUTON
========================= */

.watch{
  display:inline-block;

  margin-top:auto;

  padding:8px 13px;

  background:#e50914;

  color:white;

  border-radius:5px;

  font-size:13px;
  font-weight:bold;

  width:max-content;
}

.watch:hover{
  background:#b20710;
}


/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  color:#777;

  padding:40px;

  border-top:1px solid #222;

  margin-top:40px;
}


/* =========================
   TABLETTE
========================= */

@media(max-width:750px){

  .series-card{
    flex-basis:230px;
  }

}


/* =========================
   TÉLÉPHONE
========================= */

@media(max-width:600px){

  header{
    padding:0 20px;
  }

  .logo{
    font-size:18px;
  }

  nav a{
    margin-left:10px;
    font-size:13px;
  }

  main{
    padding:30px 20px 50px;
  }

  .section-title{
    font-size:22px;
  }

  .series-card{
    flex-basis:230px;
  }

}

</style>
</head>


<body>


<!-- =========================
     MENU
========================= -->

<header>

  <div class="logo">
    🎬 MON CINÉMA
  </div>

  <nav>

    <a href="index.html">
      Accueil
    </a>

    <a href="index.html#films">
      Films
    </a>

    <a href="series.html">
      Séries
    </a>

  </nav>

</header>


<!-- =========================
     SÉRIES
========================= -->

<main>

  <section>

    <h1 class="section-title">
      📺 Toutes les séries
    </h1>

    <div class="series-row">


      <!-- =========================
           MEURTRES À SANDHAMN
      ========================= -->

      <a
        class="series-card"
        href="detail-serie.html?serie=meurtres-sandhamn">

        <div class="thumbnail">

          <img
            src="sandhamn.jpg"
            alt="Meurtres à Sandhamn">

          <div class="play">
            ▶
          </div>

        </div>

        <div class="info">

          <h3>
            Meurtres à Sandhamn
          </h3>

          <p>
            Retrouvez les saisons et les épisodes
            de la série.
          </p>

          <div
            class="resume"
            id="resumeSandhamn">
          </div>

          <span class="watch">
            ▶ Regarder
          </span>

        </div>

      </a>


    </div>

  </section>

</main>


<footer>
© 2026 Mon Cinéma
</footer>


<script>

/* =========================
   AFFICHER LE DERNIER ÉPISODE
========================= */

const storageKey =
  "monCinema_meurtres-sandhamn";

const resumeElement =
  document.getElementById("resumeSandhamn");

try{

  const saved =
    localStorage.getItem(storageKey);

  if(saved){

    const progress =
      JSON.parse(saved);

    if(
      progress &&
      progress.saison &&
      progress.episode
    ){

      resumeElement.textContent =
        "▶ Reprendre • Saison " +
        progress.saison +
        " • Épisode " +
        progress.episode;

    }

  }

}catch(error){

  console.log(
    "Impossible de récupérer la progression."
  );

}

</script>


</body>
</html>
