<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Cinéma</title><style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  height: 70px;
  background: #0d0d0d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  border-bottom: 1px solid #222;
}

.logo {
  color: #e50914;
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 2px;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 25px;
  font-size: 15px;
}

nav a:hover {
  color: #e50914;
}

.hero {
  min-height: 520px;
  display: flex;
  align-items: center;
  padding: 60px 7%;
  background:
    linear-gradient(
      90deg,
      #080808 0%,
      rgba(8,8,8,0.85) 40%,
      rgba(8,8,8,0.2) 100%
    ),
    linear-gradient(
      135deg,
      #292929,
      #111111
    );
}

.hero-content {
  max-width: 650px;
}

.hero small {
  color: #aaa;
  font-size: 13px;
  letter-spacing: 3px;
}

.hero h1 {
  font-size: 60px;
  margin: 20px 0;
}

.hero p {
  color: #ccc;
  font-size: 18px;
  line-height: 1.6;
}

.button {
  display: inline-block;
  margin-top: 25px;
  padding: 14px 25px;
  background: #e50914;
  color: white;
  border-radius: 5px;
  text-decoration: none;
  font-weight: bold;
}

.button:hover {
  background: #b20710;
}

.section {
  padding: 50px 7%;
}

.section h2 {
  font-size: 30px;
  margin-bottom: 25px;
}

.films {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.film {
  background: #151515;
  border-radius: 10px;
  overflow: hidden;
  transition: 0.3s;
}

.film:hover {
  transform: translateY(-5px);
}

.thumbnail {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #222;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.play {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #e50914;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.info {
  padding: 18px;
}

.info h3 {
  margin-bottom: 8px;
  font-size: 20px;
}

.info p {
  color: #999;
  line-height: 1.5;
}

.watch {
  border: none;
  margin-top: 15px;
  padding: 11px 18px;
  background: #e50914;
  color: white;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}

.watch:hover {
  background: #b20710;
}

.modal {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,0.95);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.open {
  display: flex;
}

.video-box {
  width: min(1000px, 100%);
  position: relative;
}

.video-box iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
  border-radius: 8px
