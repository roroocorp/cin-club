<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon Cinéma</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* MENU */

    header {
      height: 70px;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #e50914;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
    }

    nav a:hover {
      color: #e50914;
    }

    /* ACCUEIL */

    .hero {
      min-height: 500px;
      display: flex;
      align-items: center;
      padding: 60px 7%;

      background:
        linear-gradient(
          90deg,
          #080808,
          rgba(8,8,8,.75),
          rgba(8,8,8,.2)
        ),
        linear-gradient(135deg, #292929, #111);
    }

    .hero-content {
      max-width: 650px;
    }

    .hero small {
      color: #aaa;
      letter-spacing: 3px;
    }

    .hero h1 {
      font-size: 60px;
      margin: 20px 0;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 25px;
      background: #e50914;
      color: white;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }

    /* FILMS */

    .section {
      padding: 45px 7%;
    }

    .section h2 {
      font-size: 30px;
      margin-bottom: 25px;
    }

    .films {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .film {
      background: #151515;
      border-radius: 10px;
      overflow: hidden;
      transition: .3s;
    }

    .film:hover {
      transform: translateY(-5px);
    }

    /* MINIATURE YOUTUBE */

    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #222;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 65px;
      height: 65px;

      border-radius: 50%;

      background: rgba(229, 9, 20, .95);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
    }

    .info {
      padding: 18px;
    }

    .info h3 {
      margin-bottom: 8px;
    }

    .info p {
      color: #999;
      line-height: 1.5;
    }

    .watch {
      border: none;
      margin-top: 15px;

      padding: 11px 18px;

      background: #e50914;
      color: white;

      border-radius: 5px;

      font-weight: bold;

      cursor: pointer;
    }

    .watch:hover {
      background: #b20710;
    }

    /* FENÊTRE YOUTUBE */

    .modal {
      display: none;

      position: fixed;
      z-index: 100;

      inset: 0;

      background: rgba(0,0,0,.95);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .video-box {
      width: min(1000px, 100%);
      position: relative;
    }

    .video-box iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 8px;
    }

    .close {
      position: absolute;

      right: 0;
      top: -50px;

      background: transparent;
      color: white;

      border: none;

      font-size: 38px;

      cursor: pointer;
    }

    /* FOOTER */

    footer {
      text-align: center;
      color: #777;
      padding: 40px;
      border-top: 1px solid #222;
    }

    @media (max-width: 600px) {

      header {
        padding: 0 20px;
      }

      nav a {
        margin-left: 10px;
      }

      .hero {
        padding: 40px 25px;
      }

      .hero h1 {
        font-size: 42px;
      }

      .section {
        padding: 35px 20px;
      }

    }
  </style>
</head>

<body>

  <!-- MENU -->

  <header>

    <div class="logo">
      🎬 MON CINÉMA
    </div>

    <nav>
      <a href="#">Accueil</a>
      <a href="#films">Films</a>
    </nav>

  </header>


  <!-- ACCUEIL -->

  <section class="hero">

    <div class="hero-content">

      <small>BIENVENUE SUR MON CINÉMA</small>

      <h1>Mes films.</h1>

      <p>
        Retrouvez ici mes vidéos et mes créations.
      </p>

      <a class="button" href="#films">
        🎬 Découvrir
      </a>

    </div>

  </section>


  <!-- LISTE DES VIDÉOS -->

  <section class="section" id="films">

    <h2>🎞️ Mes vidéos</h2>

    <div class="films">


      <!-- VIDÉO 1 -->

      <article class="film">

        <div class="thumbnail">

          <img
            src="https://img.youtube.com/vi/ID_VIDEO_1/maxresdefault.jpg"
            alt="Miniature du film 1">

          <div class="play">
            ▶
          </div>

        </div>

        <div class="info">

          <h3>Mon film 1</h3>

          <p>
            Découvrez mon premier film.
          </p>

          <button
            class="watch"
            onclick="watch('ID_VIDEO_1')">

            ▶ Regarder

          </button>

        </div>

      </article>


      <!-- VIDÉO 2 -->

      <article class="film">

        <div class="thumbnail">

          <img
            src="https://img.youtube.com/vi/ID_VIDEO_2/maxresdefault.jpg"
            alt="Miniature du film 2">

          <div class="play">
            ▶
          </div>

        </div>

        <div class="info">

          <h3>Mon film 2</h3>

          <p>
            Découvrez mon deuxième film.
          </p>

          <button
            class="watch"
            onclick="watch('ID_VIDEO_2')">

            ▶ Regarder

          </button>

        </div>

      </article>


      <!-- VIDÉO 3 -->

      <article class="film">

        <div class="thumbnail">

          <img
            src="https://img.youtube.com/vi/ID_VIDEO_3/maxresdefault.jpg"
            alt="Miniature du film 3">

          <div class="play">
            ▶
          </div>

        </div>

        <div class="info">

          <h3>Mon film 3</h3>

          <p>
            Découvrez mon troisième film.
          </p>

          <button
            class="watch"
            onclick="watch('ID_VIDEO_3')">

            ▶ Regarder

          </button>

        </div>

      </article>


    </div>

  </section>


  <!-- LECTEUR -->

  <div class="modal" id="modal">

    <div class="video-box">

      <button class="close" onclick="closeVideo()">
        ×
      </button>

      <iframe
        id="youtube"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>

    </div>

  </div>


  <footer>

    © 2026 Mon Cinéma

  </footer>


  <script>

    function watch(id) {

      document.getElementById("youtube").src =
        "https://www.youtube.com/embed/" +
        id +
        "?autoplay=1";

      document.getElementById("modal")
        .classList.add("open");

    }


    function closeVideo() {

      document.getElementById("youtube").src = "";

      document.getElementById("modal")
        .classList.remove("open");

    }


    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {
        closeVideo();
      }

    });

  </script>

</body>
</html>
