<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ARTE - Mon Cinéma</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 70px;

      background: #0d0d0d;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      border-bottom: 1px solid #222;
    }

    .logo {
      color: #e50914;

      font-size: 25px;

      font-weight: bold;

      letter-spacing: 2px;
    }

    .back {
      color: white;

      text-decoration: none;

      padding: 10px 18px;

      border: 1px solid #333;

      border-radius: 5px;

      transition: 0.3s;
    }

    .back:hover {
      background: #e50914;

      border-color: #e50914;
    }

    .page {
      width: min(1100px, 92%);

      margin: 45px auto 80px;
    }

    .movie-card {
      position: relative;

      background: #151515;

      border-radius: 12px;

      overflow: hidden;

      margin-bottom: 35px;

      box-shadow:
        0 0 25px rgba(255,0,0,0.12);
    }

    .movie-card::before {
      content: "";

      position: absolute;

      left: 0;

      top: 20px;

      bottom: 20px;

      width: 5px;

      background: #ff0000;

      box-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 30px rgba(255,0,0,0.8);

      z-index: 5;
    }

    .movie-info {
      padding: 30px;
    }

    .movie-info h1 {
      font-size: 32px;

      margin-bottom: 12px;
    }

    .movie-info p {
      color: #999;

      line-height: 1.6;
    }

    .video-title {
      font-size: 28px;

      margin-bottom: 20px;
    }

    .video-box {
      width: 100%;

      aspect-ratio: 16 / 9;

      background: #111;

      border-radius: 10px;

      overflow: hidden;

      box-shadow:
        0 0 25px rgba(255,0,0,0.15);
    }

    .video-box iframe {
      width: 100%;

      height: 100%;

      border: none;
    }

    .arte-button {
      display: inline-block;

      margin-top: 20px;

      padding: 13px 22px;

      background: #e50914;

      color: white;

      text-decoration: none;

      border-radius: 5px;

      font-weight: bold;
    }

    .arte-button:hover {
      background: #b20710;
    }

    .return {
      display: flex;

      width: 65px;

      height: 65px;

      margin: 60px auto 0;

      border-radius: 50%;

      background: #e50914;

      color: white;

      text-decoration: none;

      align-items: center;

      justify-content: center;

      font-size: 30px;

      box-shadow:
        0 0 10px #e50914,
        0 0 25px rgba(229,9,20,0.5);

      transition: 0.3s;
    }

    .return:hover {
      background: #b20710;

      transform: translateY(-5px);
    }

    footer {
      text-align: center;

      color: #777;

      padding: 40px;

      border-top: 1px solid #222;
    }

    @media (max-width: 600px) {

      header {
        padding: 0 20px;
      }

      .logo {
        font-size: 18px;
      }

      .back {
        font-size: 13px;
      }

      .page {
        width: 94%;

        margin-top: 30px;
      }

      .movie-info {
        padding: 22px;
      }

      .movie-info h1 {
        font-size: 25px;
      }

      .video-title {
        font-size: 23px;
      }

    }

  </style>

</head>

<body>

  <header>

    <div class="logo">
      🎬 MON CINÉMA
    </div>

    <a
      class="back"
      href="index.html">

      ← Retour aux films

    </a>

  </header>


  <main class="page">

    <div class="movie-card">

      <div class="movie-info">

        <h1>
          Dans le grand tourbillon de la vie
        </h1>

        <p>
          Regardez cette vidéo directement depuis
          la page de lecture de Mon Cinéma.
        </p>

      </div>

    </div>


    <h2 class="video-title">
      ▶ Regarder sur ARTE
    </h2>


    <div class="video-box">

      <iframe
        src="https://www.arte.tv/fr/videos/083851-000-A/dans-le-grand-tourbillon-de-la-vie/"
        title="Dans le grand tourbillon de la vie - ARTE"
        allowfullscreen>
      </iframe>

    </div>


    <a
      class="arte-button"
      href="https://www.arte.tv/fr/videos/083851-000-A/dans-le-grand-tourbillon-de-la-vie/"
      target="_blank">

      ▶ Ouvrir la vidéo sur ARTE

    </a>


    <a
      class="return"
      href="index.html"
      title="Retour aux films">

      ↑

    </a>

  </main>


  <footer>

    © 2026 Mon Cinéma

  </footer>

</body>

  </html>
