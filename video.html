<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Lecture - Mon Cinéma</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       MENU
    ========================= */

    header {
      height: 70px;
      background: #0d0d0d;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      border-bottom: 1px solid #222;

      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      color: #e50914;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .back {
      color: white;
      text-decoration: none;

      padding: 10px 18px;

      border: 1px solid #333;
      border-radius: 5px;

      transition: 0.3s;
    }

    .back:hover {
      background: #e50914;
      border-color: #e50914;
    }

    /* =========================
       PAGE
    ========================= */

    .video-page {
      width: min(1100px, 92%);
      margin: 45px auto 100px;
    }

    /* =========================
       CARTE DU FILM
    ========================= */

    .movie-card {
      position: relative;

      background: #151515;

      border-radius: 12px;

      overflow: hidden;

      margin-bottom: 35px;

      box-shadow:
        0 0 25px rgba(255,0,0,0.12);
    }

    .movie-card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 20px;
      bottom: 20px;

      width: 5px;

      background: #ff0000;

      box-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 30px rgba(255,0,0,0.8);

      z-index: 5;
    }

    .movie-poster {
      width: 100%;
      max-height: 500px;

      object-fit: cover;

      display: block;
    }

    .movie-info {
      padding: 25px;
    }

    .movie-info h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .movie-info p {
      color: #999;
      line-height: 1.6;
    }

    /* =========================
       LECTEUR
    ========================= */

    .video-title {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .video-container {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 10px;

      overflow: hidden;

      box-shadow:
        0 0 25px rgba(255,0,0,0.15);
    }

    .video-container iframe {
      width: 100%;
      height: 100%;

      border: none;

      display: block;
    }

    /* =========================
       RETOUR EN HAUT
    ========================= */

    .return {
      display: flex;

      width: 65px;
      height: 65px;

      margin: 70px auto 0;

      border-radius: 50%;

      background: #e50914;

      color: white;

      text-decoration: none;

      align-items: center;
      justify-content: center;

      font-size: 30px;

      box-shadow:
        0 0 10px #e50914,
        0 0 25px rgba(229,9,20,0.5);

      transition: 0.3s;
    }

    .return:hover {
      background: #b20710;

      transform: translateY(-5px);

      box-shadow:
        0 0 15px #e50914,
        0 0 35px rgba(229,9,20,0.7);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;

      color: #777;

      padding: 40px;

      border-top: 1px solid #222;
    }

    /* =========================
       TÉLÉPHONE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 0 20px;
      }

      .logo {
        font-size: 18px;
      }

      .back {
        font-size: 13px;
        padding: 8px 12px;
      }

      .video-page {
        width: 94%;
        margin-top: 30px;
      }

      .movie-info {
        padding: 20px;
      }

      .movie-info h1 {
        font-size: 25px;
      }

      .video-title {
        font-size: 23px;
      }

    }

  </style>

</head>


<body id="top">

    <a

      /* LECTEUR */

        document.getElementById(

        );

          movie.video;

        player.style.display =
          "block";

      }

      else {

          "none";

      }


      /* =====================
         AFFICHAGE DE L'AFFICHE
      ====================== */

        );

          movie.poster;

      }

      }

        "poster"
      ).style.display =
        "none";


      document.getElementById(
        "player"
      ).style.display =
        "none";
