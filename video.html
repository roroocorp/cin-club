<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mon Cinéma - Vidéo</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       MENU
    ========================= */

    header {
      height: 70px;

      background: #0d0d0d;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      border-bottom: 1px solid #222;

      position: sticky;
      top: 0;

      z-index: 50;
    }

    .logo {
      color: #e50914;

      font-size: 25px;

      font-weight: bold;

      letter-spacing: 2px;
    }

    nav a {
      color: white;

      text-decoration: none;

      margin-left: 25px;

      font-size: 15px;

      transition: 0.3s;
    }

    nav a:hover {
      color: #e50914;
    }

    /* =========================
       CONTENU
    ========================= */

    .container {
      width: min(1200px, 92%);

      margin: 40px auto 70px;
    }

    /* =========================
       LECTEUR
    ========================= */

    .video-box {
      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 10px;

      overflow: hidden;

      box-shadow:
        0 0 25px rgba(0,0,0,0.8);
    }

    .video-box iframe {
      width: 100%;
      height: 100%;

      border: none;

      display: block;
    }

    /* =========================
       INFORMATIONS
    ========================= */

    .movie-info {
      padding: 25px 5px;
    }

    .movie-info h1 {
      font-size: 32px;

      margin-bottom: 12px;
    }

    .movie-info p {
      color: #aaa;

      line-height: 1.6;

      font-size: 15px;
    }

    /* =========================
       RETOUR
    ========================= */

    .back-button {
      display: inline-block;

      margin-top: 20px;

      padding: 12px 20px;

      background: #e50914;

      color: white;

      text-decoration: none;

      border-radius: 5px;

      font-weight: bold;
    }

    .back-button:hover {
      background: #b20710;
    }

    /* =========================
       ERREUR
    ========================= */

    .error {
      text-align: center;

      padding: 100px 20px;
    }

    .error h1 {
      font-size: 35px;

      margin-bottom: 15px;
    }

    .error p {
      color: #888;

      margin-bottom: 25px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 0 20px;
      }

      .logo {
        font-size: 18px;
      }

      nav a {
        margin-left: 10px;

        font-size: 13px;
      }

      .container {
        width: 94%;

        margin-top: 25px;
      }

      .movie-info h1 {
        font-size: 25px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       MENU
  ========================= -->

  <header>

    <div class="logo">
      🎬 MON CINÉMA
    </div>

    <nav>

      <a href="index.html">
        Accueil
      </a>

      <a href="index.html#films">
        Films
      </a>

      <a href="series.html">
        Séries
      </a>

    </nav>

  </header>

  ========================= -->

      }

    };


    /*
      =========================
      AFFICHAGE
      =========================
    */

    const content =
      document.getElementById("content");


    if (
      id &&
      movies[id]
    ) {

      const movie =
        movies[id];


      /*
        Si la vidéo existe
      */

      if (movie.video) {

        content.innerHTML = `

          <div class="video-box">

            <iframe
              src="${movie.video}"
              allowfullscreen
              allow="autoplay; fullscreen">
            </iframe>

          </div>

          <div class="movie-info">

            <h1>
              ${movie.title}
            </h1>

            <p>
              ${movie.description}
            </p>

            <a
              href="index.html"
              class="back-button">

              ← Retour aux films

            </a>

          </div>

        `;

      }


      /*
        Film connu mais vidéo
        pas encore renseignée
      */

      else {

        content.innerHTML = `

          <div class="error">

            <h1>
              🎬 ${movie.title}
            </h1>

            <p>
              Cette vidéo n'est pas encore disponible.
            </p>

            <a
              href="index.html"
              class="back-button">

              ← Retour aux films

            </a>

          </div>

        `;

      }

    }


    /*
      =========================
      ID INCONNU
      =========================
    */

    else {

      content.innerHTML = `

        <div class="error">

          <h1>
            🎬 Film introuvable
          </h1>

          <p>
            Le film demandé n'existe pas
            dans Mon Cinéma.
          </p>

          <a
            href="index.html"
            class="back-button">

            ← Retour à l'accueil

          </a>

        </div>

      `;

    }

  </script>


</body>

</html>
